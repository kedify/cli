version: 2

project_name: kedify

builds:
  - id: kedify
    main: ./cmd/kedify
    binary: kedify
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: kedify
    ids:
      - kedify
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - NOTICE
      - README.md
      - licenses/*.txt

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"

release:
  make_latest: true
  prerelease: auto

brews:
  - name: kedify
    ids:
      - kedify
    skip_upload: "{{ .IsSnapshot }}"
    repository:
      owner: kedify
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/kedify/cli"
    description: "Kedify CLI"
    extra_install: |
      pkgshare.install "LICENSE", "NOTICE", "licenses"
    caveats: |
      The bundled recommendation engine uses Kedify's commercial license.
      Production analysis requires a subscription covering that feature, including offline use.
      See #{pkgshare}/NOTICE and #{pkgshare}/licenses for the terms and trial permissions.

changelog:
  use: git

snapshot:
  version_template: "{{ .Version }}-next"
